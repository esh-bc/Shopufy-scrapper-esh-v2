name: Shopify Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build scraper
        run: go build -o shopify-scraper main.go

      - name: Run scraper
        run: ./shopify-scraper

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopify-valid-stores
          path: valid_stores.txt
          retention-days: 90
